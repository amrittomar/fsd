server:
  port: 8080

spring:
  application:
    name: exp6-scalable-read-apis
  datasource:
    url: jdbc:h2:mem:exp6db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
  cache:
    type: caffeine
    cache-names: posts-page, post-details, analytics-dashboard
    caffeine:
      spec: maximumSize=500, expireAfterWrite=10m

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.category: DEBUG
    com.fsd.exp6: DEBUG
